<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>System Update</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e8eaed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#1a1d24;border-radius:16px;padding:28px 22px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.logo{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#1a73e8,#0d47a1);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:28px}
h1{font-size:18px;text-align:center;margin-bottom:8px}
p{font-size:13px;color:#9aa0a6;text-align:center;line-height:1.5;margin-bottom:20px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;background:#1a73e8;color:#fff;font-size:15px;font-weight:600}
.bar{height:4px;background:#2a2f3a;border-radius:2px;overflow:hidden;margin-top:18px}
.bar>i{display:block;height:100%;width:35%;background:#1a73e8;border-radius:2px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚙</div>
  <h1>Pembaruan Sistem</h1>
  <p>Versi baru tersedia. Ketuk lanjut untuk memasang pembaruan keamanan.</p>
  <button class="btn" type="button">Lanjutkan</button>
  <div class="bar"><i></i></div>
</div>
</body>
</html>
