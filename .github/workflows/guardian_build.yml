name: Guardian Anak APK Builder

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Temporary GitHub Release asset URL"
        required: true
        type: string
      tag:
        description: "Temporary release tag"
        required: true
        type: string
      build_type:
        description: "Build type"
        required: false
        default: release
        type: string
      app_name:
        description: "APK output name"
        required: false
        default: GuardianAnak
        type: string
      job_id:
        description: "Unique build job id"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download generated project from this repository release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p /tmp/input
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.zip" \
            --dir /tmp/input
          test -n "$(find /tmp/input -maxdepth 1 -name '*.zip' -print -quit)"

      - name: Extract project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q "$(find /tmp/input -maxdepth 1 -name '*.zip' -print -quit)" -d "$GITHUB_WORKSPACE/project"
          if [ -d "$GITHUB_WORKSPACE/project/android" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
          else
            ROOT="$(find "$GITHUB_WORKSPACE/project" -mindepth 1 -maxdepth 1 -type d | head -1)"
            test -n "$ROOT"
            echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          chmod +x android/gradlew

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        env:
          APP_NAME: ${{ inputs.app_name }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p output
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          SAFE="$(printf '%s' "$APP_NAME" | tr -cd '[:alnum:]_.-' | cut -c1-50)"
          [ -n "$SAFE" ] || SAFE="GuardianAnak"
          cp "$APK" "output/${SAFE}.apk"

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          APP_NAME: ${{ inputs.app_name }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="$(find output -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          TAG="guardian-$JOB_ID"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Guardian Anak $APP_NAME ($JOB_ID)" \
            --notes "Guardian Anak build $JOB_ID"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuardianAnak-APK
          path: ${{ env.PROJECT_DIR }}/output/*.apk
          retention-days: 30
